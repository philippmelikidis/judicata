# judicata contract. It is frozen: change it only through /judicata:contract,
# every stored version is recorded in .judicata/ledger.jsonl.
name = "code"
template = "code"
paths = ["src/**"]

[reviewers]
count = 2
models = ["inherit"]

[stop]
max_rounds = 5
stall_rounds = 2

[[criteria]]
id = "CODE-1"
text = "Tests pass"
check = "command"
required = true
command = "true"
timeout = 600

[[criteria]]
id = "CODE-2"
text = "Linter is clean"
check = "command"
required = true
command = "true"
timeout = 300

[[criteria]]
id = "CODE-3"
text = "No known correctness bugs in the scope: no input or state that leads to a wrong result or a crash"
check = "judgment"
required = true

[[criteria]]
id = "CODE-4"
text = "The acceptance criteria of the ticket are met"
check = "judgment"
required = false
